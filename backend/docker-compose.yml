services:
  # --------------------------------------------------------------- vLLM (GPU)
  # Self-hosted model serving (Part A). One GPU: Qwen2.5-VL serves BOTH text
  # and image tasks (assignment's suggested memory-saving option, Step 5).
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen2.5-VL-7B-Instruct
      --max-model-len 8192
      --gpu-memory-utilization 0.85
      --dtype auto
      --port 8001
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  # ------------------------------------------------------------- API service
  api:
    build: .
    environment:
      - VLLM_BASE_URL=http://vllm:8001/v1
      - VLLM_MODEL_NAME=Qwen/Qwen2.5-VL-7B-Instruct
      - VLLM_VISION_MODEL_NAME=Qwen/Qwen2.5-VL-7B-Instruct
      - API_PORT=3003
      - LOG_LEVEL=INFO
    volumes:
      - index-data:/srv/data
    ports:
      - "3003:3003"
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped

  # Optional: swap the built-in numpy store for Qdrant (see README § Vector
  # store swap). Enabled with: docker compose --profile qdrant up
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  huggingface-cache:
  index-data:
  qdrant-data:
